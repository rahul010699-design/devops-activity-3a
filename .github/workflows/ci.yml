
name: Secure CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff bandit pip-audit pytest-cov

      - name: Ruff lint
        run: ruff check app tests

      - name: Run tests with coverage
        run: |
          pytest tests \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Bandit security scan
        run: bandit -r app -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-checks:
    name: Dockerfile and Container Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: activity-3a-api:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-3a-api:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: json
          output: trivy-full-report.json
          exit-code: "0"

      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-full-vulnerability-report
          path: trivy-full-report.json
          if-no-files-found: warn

      - name: Enforce actionable OS vulnerability gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-3a-api:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs:
      - python-checks
      - secret-scan
      - docker-checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      SERVICE: activity-3a-api

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/360368960816/locations/global/workloadIdentityPools/github-pool/providers/activity-3a-github-provider
          service_account: activity-3a-deploy@lunar-works-316500.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:${{ github.sha }}
        run: |
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="activity-3a-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port=8080 \
            --max=2 \
            --quiet


      - name: Post-deployment health check
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"

          if [ -z "$SERVICE_URL" ]; then
            echo "Could not retrieve the Cloud Run service URL."
            exit 1
          fi

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${SERVICE_URL%/}/health"; then
              echo "Health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt failed; retrying..."
            sleep 5
          done

          echo "Health check failed after retries."
          exit 1
