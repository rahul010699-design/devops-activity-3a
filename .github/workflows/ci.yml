
name: Secure CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff bandit pip-audit pytest-cov

      - name: Ruff lint
        run: ruff check app tests

      - name: Run tests with coverage
        run: |
          pytest tests \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Bandit security scan
        run: bandit -r app -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-checks:
    name: Dockerfile and Container Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: activity-3a-api:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-3a-api:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: json
          output: trivy-full-report.json
          exit-code: "0"

      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-full-vulnerability-report
          path: trivy-full-report.json
          if-no-files-found: warn

      - name: Enforce actionable OS vulnerability gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-3a-api:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs:
      - python-checks
      - secret-scan
      - docker-checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      SERVICE: activity-3a-api

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/360368960816/locations/global/workloadIdentityPools/github-pool/providers/activity-3a-github-provider
          service_account: activity-3a-deploy@lunar-works-316500.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:${{ github.sha }}
        run: |
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Capture previous Cloud Run revision
        id: previous
        run: |
          PREVIOUS_REVISION="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.traffic[0].revisionName)')"

          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "No previous traffic revision found."
            exit 1
          fi

          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"
          echo "Previous revision: $PREVIOUS_REVISION"

      - name: Deploy new revision without traffic
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="activity-3a-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port=8080 \
            --max=2 \
            --tag=smoke \
            --no-traffic \
            --quiet

      
      - name: Smoke test and automatic rollback
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.previous_revision }}
        run: |
          NEW_REVISION="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.latestCreatedRevisionName)')"

          if [ -z "$NEW_REVISION" ]; then
            echo "Could not identify the new revision."
            exit 1
          fi

          REVISION_URL="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json | jq -r '.status.traffic[] | select(.tag == "smoke") | (.url // .uri // empty)')"

          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"

          if [ -z "$REVISION_URL" ] || [ -z "$SERVICE_URL" ]; then
            echo "Could not retrieve the smoke-test or service URL."
            exit 1
          fi

          echo "Previous revision: $PREVIOUS_REVISION"
          echo "New revision: $NEW_REVISION"
          echo "Testing: $REVISION_URL"

          HEALTHY=false

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${REVISION_URL%/}/health"; then
              HEALTHY=true
              break
            fi

            echo "Health check attempt $attempt failed."
            sleep 5
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "New revision passed health checks."

            gcloud run services update-traffic "$SERVICE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --to-revisions="${NEW_REVISION}=100" \
              --quiet

            echo "100% traffic routed to $NEW_REVISION."
          else
            echo "New revision failed health checks."
            echo "Rolling back to $PREVIOUS_REVISION."

            gcloud run services update-traffic "$SERVICE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --to-revisions="${PREVIOUS_REVISION}=100" \
              --quiet

            echo "Traffic restored to $PREVIOUS_REVISION."
            exit 1
          fi


  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    env:
      CLOUD_RUN_URL: https://activity-3a-api-avbr4zsxia-el.a.run.app

    steps:
      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-reports
          docker run --rm \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$CLOUD_RUN_URL/docs" \
            -m 1 \
            -I \
            -r /zap/wrk/zap-baseline-report.html \
            -J /zap/wrk/zap-baseline-report.json

          echo "Generated ZAP reports:"
          ls -lh zap-reports/

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-reports
          path: zap-reports/zap-baseline-report.*
          if-no-files-found: warn
